<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet" />
    <title>Windtunnel — a pricing scenario sandbox</title>
    <meta
      name="description"
      content="Windtunnel is an illustrative pricing scenario sandbox using three hand-set customer cohorts and 500 repeatable model runs. It is not a calibrated forecast or launch recommendation."
    />
    <meta property="og:title" content="Windtunnel" />
    <meta
      property="og:description"
      content="Rehearse a pricing scenario with explicit assumptions, percentiles, and model limitations."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        var theme = null;
        try { theme = localStorage.getItem("theme"); } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        var root = document.documentElement;
        root.setAttribute("data-theme", theme);
        root.classList.toggle("dark", theme === "dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
